<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Энциклопедия F1 - Вход</title>
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="content-wrapper">
        <header>
            <h1>Энциклопедия Формулы-1</h1>
            <p>Войдите в свой аккаунт</p>
            <nav>
                <ul>
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="teams.html">Команды</a></li>
                    <li><a href="legends.html">Легенды</a></li>
                    <li><a href="register.html">Регистрация</a></li>
                    <li><a href="login.html">Вход</a></li>
                </ul>
            </nav>
            <hr>
        </header>

        <main class="form-page-main">
            <div class="form-container">
                <h2>Вход</h2>
                
                <form>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="example@mail.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Пароль</label>
                        <input type="password" id="password" name="password" placeholder="Введите пароль" required minlength="6">
                    </div>

                    <div class="form-group">
                        <div class="checkbox-group">
                            <label>
                                <input type="checkbox" name="remember"> Запомнить меня
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">Войти</button>
                </form>

                <hr>

                <div class="form-link">
                    Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
                </div>
            </div>
        </main>

        <footer>
            <hr>
            <p><a href="#top">⬆ Вернуться наверх</a></p>
            <p>&copy; 2026 Энциклопедия F1. Все права защищены.</p>
        </footer>
    </div>
</body>
</html>
