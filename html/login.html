<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Энциклопедия F1 - Вход</title>
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/light-theme.css">
</head>
<body>
    <div class="content-wrapper">
        <div id="header-placeholder"></div>

        <main class="form-page-main">
            <div class="form-container">
                <h2>Вход</h2>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="example@mail.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Пароль</label>
                        <input type="password" id="password" name="password" placeholder="Введите пароль" required minlength="6">
                    </div>

                    <div class="form-group">
                        <div class="checkbox-group">
                            <label>
                                <input type="checkbox" name="remember"> Запомнить меня
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">Войти</button>
                </form>

                <hr>

                <div class="form-link">
                    Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
                </div>
            </div>
        </main>

        <div id="footer-placeholder"></div>
    </div>
    <script src="../js/login.js"></script>
    <script src="../js/components.js"></script>
</body>
</html>
