<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Энциклопедия F1 - Регистрация</title>
    <link rel="stylesheet" href="../css/register.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/light-theme.css">
</head>
<body>
    <div class="content-wrapper">
        <div id="header-placeholder"></div>

        <main class="form-page-main">
            <div class="form-container">
                <h2>Регистрация</h2>
                
                <form id="registerForm">
                    <!-- Email -->
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <div class="input-wrapper">
                            <input type="email" id="email" name="email" placeholder="example@mail.com" required>
                        </div>
                        <div class="field-hint">Введите email для входа</div>
                    </div>

                    <!-- Пароль -->
                    <div class="form-group">
                        <label for="password">Пароль *</label>
                        <div class="input-wrapper">
                            <input type="password" id="password" name="password" placeholder="Минимум 6 символов" required minlength="6">
                        </div>
                        <div class="field-hint">Пароль должен содержать минимум 6 символов</div>
                    </div>

                    <!-- Подтверждение пароля -->
                    <div class="form-group">
                        <label for="confirm_password">Подтвердите пароль *</label>
                        <div class="input-wrapper">
                            <input type="password" id="confirm_password" name="confirm_password" placeholder="Введите пароль еще раз" required minlength="6">
                        </div>
                    </div>

                    <!-- Никнейм -->
                    <div class="form-group">
                        <label for="nickname">Никнейм</label>
                        <input type="text" id="nickname" name="nickname" placeholder="Как к вам обращаться">
                        <div class="field-hint">Можно оставить пустым — будет использован email</div>
                    </div>

                    <hr>

                    <!-- Аватар -->
                    <div class="form-group">
                        <label for="avatar">Аватар</label>
                        <input type="file" id="avatar" name="avatar" accept="image/jpeg, image/png, image/jpg, image/webp">
                        <div class="field-hint">Максимальный размер 500×500px, фото будет обрезано до квадрата</div>
                        <canvas id="avatarCanvas" style="display: none;"></canvas>
                        <div id="avatarPreview" style="display: none; margin-top: 15px;">
                            <img id="previewImg" width="100" height="100" style="object-fit: cover; border: 2px solid #e10600;">
                        </div>
                    </div>

                    <!-- Роль -->
                    <div class="form-group">
                        <label>Роль</label>
                        <div class="radio-group">
                            <label>
                                <input type="radio" name="role" value="fan" checked> Болельщик
                            </label>
                            <label>
                                <input type="radio" name="role" value="expert"> Эксперт
                            </label>
                        </div>
                        <div class="field-hint">Эксперты могут публиковать аналитику</div>
                    </div>

                    <!-- Любимая команда -->
                    <div class="form-group">
                        <label for="team">Любимая команда</label>
                        <select id="team" name="team">
                            <option value="">Выберите команду</option>
                            <option value="ferrari">Ferrari</option>
                            <option value="mclaren">McLaren</option>
                            <option value="redbull">Red Bull Racing</option>
                            <option value="mercedes">Mercedes</option>
                            <option value="astonmartin">Aston Martin</option>
                            <option value="alpine">Alpine</option>
                            <option value="williams">Williams</option>
                            <option value="haas">Haas</option>
                            <option value="racingbulls">Racing Bulls</option>
                            <option value="sauber">Audi</option>
                            <option value="cadillac">Cadillac F1</option>
                        </select>
                    </div>

                    <!-- Получать новости -->
                    <div class="form-group">
                        <div class="toggle-group">
                            <label class="toggle-switch">
                                <input type="checkbox" id="newsletter" name="newsletter" checked>
                                <span class="toggle-slider"></span>
                            </label>
                            <label class="toggle-label">Получать новости и обновления</label>
                        </div>
                        <div class="field-hint">Раз в неделю — дайджест главных новостей F1</div>
                    </div>

                    <!-- Запомнить меня -->
                    <div class="form-group">
                        <div class="checkbox-group">
                            <label>
                                <input type="checkbox" name="remember"> Запомнить меня
                            </label>
                        </div>
                    </div>

                    <div class="form-buttons">
                        <button type="reset" class="btn btn-secondary">Очистить</button>
                        <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
                    </div>
                </form>

                <hr>

                <div class="form-link">
                    Уже есть аккаунт? <a href="login.html">Войти</a>
                </div>
            </div>
        </main>

        <div id="footer-placeholder"></div>
    </div>
    <script src="../js/components.js"></script>
    <script src="../js/register.js"></script>
</body>
</html>
